<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>ابن بطوطة - الخريطة</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #efe2c7;
    font-family: Arial, sans-serif;
}

.game {
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
}

/* عنوان اللعبة */
.title {
    position: absolute;
    top: 3vh;
    left: 0;
    right: 0;
    text-align: center;
    font-size: clamp(24px, 4vw, 48px);
    font-weight: bold;
    color: #17120d;
    z-index: 5;
}

/* منطقة الخريطة */
.map-container {
    position: relative;
    width: min(94vw, 1500px);
    aspect-ratio: 16 / 9;
    max-height: 82vh;
    overflow: hidden;
    border-radius: 18px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.18);
}

/* صورة الخريطة */
.map-image {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
}

/* زر الرجوع */
.back-button {
    position: absolute;
    top: 3vh;
    left: 3vw;
    width: clamp(50px, 6vw, 75px);
    height: clamp(50px, 6vw, 75px);
    border: none;
    border-radius: 50%;
    background: #b97938;
    color: white;
    font-size: clamp(25px, 3vw, 40px);
    cursor: pointer;
    z-index: 10;
}

/* علامات الدول — سنضع مواقعها لاحقًا */
.country-marker {
    position: absolute;
    width: clamp(18px, 2.2vw, 30px);
    height: clamp(18px, 2.2vw, 30px);
    border-radius: 50%;
    background: #c47b3d;
    border: 3px solid white;
    box-shadow: 0 3px 10px rgba(0,0,0,0.3);
    transform: translate(-50%, -50%);
    cursor: pointer;
    display: none;
}

.country-marker:hover {
    transform: translate(-50%, -50%) scale(1.2);
}
</style>
</head>

<body>

<div class="game">

    <button class="back-button" onclick="history.back()">←</button>

    <div class="title">
        اختر بلدك لبدء رحلتك
    </div>

    <div class="map-container">

        <img
            src="map-background.png"
            alt="خريطة الوطن العربي"
            class="map-image"
        >

        <!-- علامات الدول سنضيفها هنا لاحقًا -->

    </div>

</div>

</body>
</html>
