<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ابن بطوطة في الوطن العربي</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: #f4ead8;
    color: #34271c;
}

.screen {
    min-height: 100vh;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 25px;
}

.screen.active {
    display: flex;
}

.card {
    width: 100%;
    max-width: 420px;
    text-align: center;
}

.title {
    font-size: 30px;
    margin-bottom: 12px;
}

.subtitle {
    color: #776754;
    font-size: 17px;
    margin-bottom: 35px;
}

/* الأزرار */

.options {
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.option {
    width: 100%;
    padding: 20px;
    border-radius: 18px;
    border: 2px solid #c49a61;
    background: #fffaf1;
    font-size: 20px;
    font-weight: bold;
    color: #34271c;
    cursor: pointer;
}

.option:active {
    transform: scale(.98);
}

/* العمر */

.age-number {
    font-size: 70px;
    font-weight: bold;
    margin: 20px 0;
}

.age-label {
    font-size: 20px;
    color: #776754;
}

.age-controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 25px;
    margin: 20px 0 35px;
}

.age-button {
    width: 55px;
    height: 55px;
    border-radius: 50%;
    border: none;
    background: #b47b3c;
    color: white;
    font-size: 30px;
}

.continue {
    width: 100%;
    padding: 17px;
    border: none;
    border-radius: 15px;
    background: #a86d32;
    color: white;
    font-size: 19px;
    font-weight: bold;
}

.back {
    margin-top: 18px;
    border: none;
    background: transparent;
    color: #806c55;
    font-size: 16px;
}

/* المشهد */

.story {
    position: relative;
    overflow: hidden;
    background:
        linear-gradient(
            to bottom,
            #b9d8e5 0%,
            #e9d5a8 65%,
            #c99c5a 100%
        );
}

.scene {
    width: 100%;
    max-width: 500px;
    min-height: 650px;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding-bottom: 70px;
}

.sun {
    position: absolute;
    top: 70px;
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: #f4c96a;
    opacity: .9;
}

.character {
    font-size: 110px;
    z-index: 2;
    margin-bottom: 20px;
}

.magic-carpet {
    width: 250px;
    height: 55px;
    border-radius: 50%;
    background: #8b4939;
    border: 5px solid #d5a65b;
    box-shadow: 0 12px 20px rgba(0,0,0,.18);
    position: relative;
    animation: float 2.5s ease-in-out infinite;
}

.magic-carpet::after {
    content: "✦  ✦  ✦";
    color: #f3d38a;
    font-size: 18px;
    position: absolute;
    left: 50%;
    top: 12px;
    transform: translateX(-50%);
}

@keyframes float {
    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-10px);
    }
}

.dialogue {
    position: absolute;
    bottom: 20px;
    width: calc(100% - 30px);
    background: rgba(255,250,241,.96);
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 8px 25px rgba(0,0,0,.15);
    font-size: 19px;
    line-height: 1.7;
    text-align: right;
}

.dialogue-name {
    font-weight: bold;
    color: #a86d32;
    margin-bottom: 5px;
}

.dialogue-button {
    display: block;
    margin-top: 12px;
    margin-right: auto;
    border: none;
    background: #a86d32;
    color: white;
    border-radius: 10px;
    padding: 10px 18px;
    font-size: 15px;
}
</style>
</head>

<body>

<!-- اختيار الجنس -->

<section id="gender" class="screen active">

    <div class="card">

        <h1 class="title">اختر شخصيتك</h1>

        <p class="subtitle">
            اختر الشخصية التي ستخوض الرحلة
        </p>

        <div class="options">

            <button class="option" onclick="selectGender('male')">
                👨 ابن بطوطة
            </button>

            <button class="option" onclick="selectGender('female')">
                👩 بنت بطوطة
            </button>

        </div>

    </div>

</section>


<!-- اختيار العمر -->

<section id="age" class="screen">

    <div class="card">

        <h1 class="title">اختر عمرك</h1>

        <div class="age-number" id="ageNumber">
            15
        </div>

        <div class="age-label">
            سنة
        </div>

        <div class="age-controls">

            <button class="age-button" onclick="changeAge(-1)">
                −
            </button>

            <button class="age-button" onclick="changeAge(1)">
                +
            </button>

        </div>

        <button class="continue" onclick="startStory()">
            متابعة
        </button>

        <button class="back" onclick="showScreen('gender')">
            ← رجوع
        </button>

    </div>

</section>


<!-- المشهد القصصي -->

<section id="story" class="screen story">

    <div class="scene">

        <div class="sun"></div>

        <div class="character" id="character">
            👨
        </div>

        <div class="magic-carpet"></div>

        <div class="dialogue">

            <div class="dialogue-name">
                البساط السحري
            </div>

            <div id="dialogueText">
                مرحبًا!
            </div>

            <button class="dialogue-button" onclick="nextDialogue()">
                متابعة
            </button>

        </div>

    </div>

</section>


<script>

let gender = "";
let age = 15;

let dialogueStep = 0;

function showScreen(id) {

    document.querySelectorAll(".screen").forEach(screen => {
        screen.classList.remove("active");
    });

    document.getElementById(id).classList.add("active");
}


function selectGender(selectedGender) {

    gender = selectedGender;

    showScreen("age");
}


function changeAge(amount) {

    age += amount;

    if (age < 15) {
        age = 15;
    }

    document.getElementById("ageNumber").textContent = age;
}


function startStory() {

    if (gender === "female") {
        document.getElementById("character").textContent = "👩";
    } else {
        document.getElementById("character").textContent = "👨";
    }

    dialogueStep = 0;

    document.getElementById("dialogueText").textContent =
        "مرحب
