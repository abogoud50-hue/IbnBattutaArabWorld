<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ابن بطوطة في الوطن العربي</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f5ead7;
      color: #3d2b1f;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .game {
      width: 100%;
      max-width: 500px;
      min-height: 100vh;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 12px;
    }

    p {
      font-size: 18px;
      line-height: 1.7;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 16px;
      padding: 18px;
      margin-top: 12px;
      font-size: 19px;
      font-weight: bold;
      cursor: pointer;
      background: #8b5e3c;
      color: white;
    }

    button:active {
      transform: scale(0.98);
    }

    .hidden {
      display: none;
    }

    .character {
      font-size: 80px;
      margin: 20px 0;
    }

    .card {
      background: rgba(255,255,255,0.6);
      padding: 25px;
      border-radius: 24px;
    }
  </style>
</head>

<body>

  <main class="game">

    <!-- الشاشة الأولى -->
    <section id="welcome">
      <div class="character">🧭</div>

      <h1>ابن بطوطة في الوطن العربي</h1>

      <p>
        رحلة جديدة تبدأ من هنا...
        اختر شخصيتك وانطلق في مغامرة عبر الوطن العربي.
      </p>

      <button onclick="showGender()">
        ابدأ الرحلة
      </button>
    </section>


    <!-- اختيار الجنس -->
    <section id="gender" class="hidden">
      <div class="card">

        <h1>اختر شخصيتك</h1>

        <p>من سيكون بطل الرحلة؟</p>

        <button onclick="chooseGender('male')">
          👨 ابن بطوطة
        </button>

        <button onclick="chooseGender('female')">
          👩 بنت بطوطة
        </button>

      </div>
    </section>


    <!-- اختيار البداية -->
    <section id="start" class="hidden">
      <div class="card">

        <h1 id="characterName"></h1>

        <p>
          اختر منطقة انطلاق رحلتك:
        </p>

        <button onclick="startGame('موريتانيا')">
          🇲🇷 موريتانيا
        </button>

        <button onclick="startGame('المغرب')">
          🇲🇦 المغرب
        </button>

        <button onclick="startGame('مصر')">
          🇪🇬 مصر
        </button>

        <button onclick="startGame('السعودية')">
          🇸🇦 السعودية
        </button>

        <button onclick="startGame('العراق')">
          🇮🇶 العراق
        </button>

        <button onclick="startGame('عمان')">
          🇴🇲 عمان
        </button>

      </div>
    </section>


    <!-- بداية اللعبة -->
    <section id="gameScreen" class="hidden">
      <div class="card">

        <div class="character">🧭</div>

        <h1 id="welcomePlayer"></h1>

        <p id="locationText"></p>

        <p>
          🗺️ هنا ستظهر خريطة الوطن العربي الحقيقية
          في النسخة القادمة.
        </p>

        <button onclick="alert('المغامرة قادمة!')">
          تابع الرحلة
        </button>

      </div>
    </section>

  </main>


  <script>

    let playerName = "";

    function hideAll() {
      document.getElementById("welcome").classList.add("hidden");
      document.getElementById("gender").classList.add("hidden");
      document.getElementById("start").classList.add("hidden");
      document.getElementById("gameScreen").classList.add("hidden");
    }

    function showGender() {
      hideAll();
      document.getElementById("gender").classList.remove("hidden");
    }

    function chooseGender(gender) {

      if (gender === "male") {
        playerName = "ابن بطوطة";
      } else {
        playerName = "بنت بطوطة";
      }

      document.getElementById("characterName").textContent =
        playerName;

      hideAll();
      document.getElementById("start").classList.remove("hidden");
    }

    function startGame(location) {

      document.getElementById("welcomePlayer").textContent =
        "أهلًا يا " + playerName;

      document.getElementById("locationText").textContent =
        "رحلتك تبدأ من " + location;

      hideAll();
      document.getElementById("gameScreen").classList.remove("hidden");
    }

  </script>

</body>
</html>
